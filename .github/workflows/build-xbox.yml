name: Build Xbox360BadUpdate v1.3

on:
  workflow_dispatch:
  push:
    branches:
      - v1.3

jobs:
  build:
    name: Build Exploit
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: v1.3

      - name: Setup .NET 6 Runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Verify build tools
        shell: cmd
        run: |
          echo ==============================
          echo CHECKING BUILD TOOLS
          echo ==============================

          if not exist "Tools\XePatcher\XePatcher.exe" (
            echo ERROR: XePatcher.exe not found
            exit /b 1
          )

          if not exist "Tools\ObjLink\ObjLink.exe" (
            echo ERROR: ObjLink.exe not found
            exit /b 1
          )

          echo XePatcher.exe FOUND
          echo ObjLink.exe FOUND

      - name: Verify .NET
        shell: cmd
        run: |
          echo ==============================
          echo CHECKING .NET
          echo ==============================
          dotnet --list-runtimes

      - name: Build exploit
        shell: cmd
        run: |
          echo ==============================
          echo BUILDING ROCK BAND BLITZ
          echo ==============================

          call build_exploit.bat RBB RETAIL_BUILD

          if errorlevel 1 (
            echo.
            echo ==============================
            echo BUILD FAILED
            echo ==============================
            exit /b %errorlevel%
          )

          echo.
          echo ==============================
          echo BUILD SCRIPT FINISHED
          echo ==============================

      - name: Show build output
        shell: cmd
        run: |
          echo ==============================
          echo BUILD OUTPUT
          echo ==============================

          if not exist "bin" (
            echo ERROR: bin folder was not created.
            exit /b 1
          )

          dir /s /b "bin"

      - name: Verify compiled files
        shell: cmd
        run: |
          set "OUT=bin\RETAIL_BUILD\RockBandBlitz"

          echo ==============================
          echo VERIFYING COMPILED FILES
          echo ==============================

          if not exist "%OUT%" (
            echo ERROR: Output directory not found.
            exit /b 1
          )

          if not exist "%OUT%\BadUpdateExploit-Data.bin" (
            echo ERROR: BadUpdateExploit-Data.bin missing.
            exit /b 1
          )

          if not exist "%OUT%\BadUpdateExploit-2ndStage.bin" (
            echo ERROR: BadUpdateExploit-2ndStage.bin missing.
            exit /b 1
          )

          if not exist "%OUT%\BadUpdateExploit-3rdStage.bin" (
            echo ERROR: BadUpdateExploit-3rdStage.bin missing.
            exit /b 1
          )

          if not exist "%OUT%\BadUpdateExploit-4thStage.bin" (
            echo ERROR: BadUpdateExploit-4thStage.bin missing.
            exit /b 1
          )

          echo.
          echo ==============================
          echo ALL COMPILED FILES FOUND
          echo ==============================

          dir "%OUT%"

      - name: Upload compiled output
        uses: actions/upload-artifact@v4
        with:
          name: Xbox360BadUpdate-v1.3-RBB
          path: bin/RETAIL_BUILD/RockBandBlitz/
          if-no-files-found: error
